name: Validate project metadata

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Reject respondent-level data formats in the repository
        run: python scripts/validate_repository_data_boundary.py

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run unit tests
        run: python scripts/run_ci_unit_tests.py

      - name: Parse website JSON catalogs
        run: python -c "import json,pathlib; files=list(pathlib.Path('site-prototype/dist').glob('*.json')); data=[json.loads(p.read_text(encoding='utf-8')) for p in files]; print(f'Parsed {len(files)} JSON catalogs'); rows=json.loads(pathlib.Path('site-prototype/dist/catalog.json').read_text(encoding='utf-8')); blank=[r for r in rows if r.get('epcf','').lower() in {'e','p'} and not (r.get('candidate_concept_ids') or r.get('Concept.ID.Candidates') or '').strip()]; assert not blank, f'{len(blank)} E/P catalog rows have no concept link'"

      - name: Validate public website payload
        run: python scripts/validate_public_site_payload.py site-prototype/dist

      - name: Reject tabular data and archives from the public site bundle
        run: python scripts/validate_public_site_file_boundary.py site-prototype/dist

      - name: Audit planned Wave 1 scale-up hypothesis registry
        run: python scripts/audit_wave1_scaleup_hypothesis_registry.py

      - name: Cross-check Wave 1 scale-up against reviewed public metadata
        run: python scripts/audit_wave1_scaleup_metadata_readiness.py

      - name: Check website JavaScript syntax
        run: node --check site-prototype/dist/app.js

      - name: Check deferred website data loading
        run: node tests/test_deferred_asset_loader.cjs

      - name: Exercise reviewed association browser filters
        run: node tests/test_association_results_browser.cjs

  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Serve the public site
        run: |
          nohup python3 -m http.server 8777 --directory site-prototype/dist > /tmp/site.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8777/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/site.log
          exit 1

      - name: Start headless Chrome with CDP
        run: |
          nohup google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9222 about:blank > /tmp/chrome.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/chrome.log
          exit 1

      - name: Run the browser regression
        run: node scripts/browser_regression.mjs http://127.0.0.1:8777/index.html

  synthetic-survey-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned synthetic-audit dependencies
        run: python -m pip install -r requirements-survey-audit.txt

      - name: Run synthetic survey-engine probe
        run: python audit/survey_engine_synthetic_trial.py

      - name: Run generic ExWAS engine synthetic tests
        run: python -m unittest tests.test_exwas_engine tests.test_engine_to_schema_v3 tests.test_engine_executor_consistency -v
