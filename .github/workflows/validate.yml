name: Validate project metadata

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Parse website JSON catalogs
        run: python -c "import json,pathlib; files=list(pathlib.Path('site-prototype/dist').glob('*.json')); [json.loads(p.read_text(encoding='utf-8')) for p in files]; print(f'Parsed {len(files)} JSON catalogs')"

      - name: Check website JavaScript syntax
        run: node --check site-prototype/dist/app.js
