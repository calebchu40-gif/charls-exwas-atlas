name: Deploy public atlas site

on:
  push:
    branches: [main]
    paths:
      - 'site-prototype/dist/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v5

      - name: Validate static site payload
        run: python scripts/validate_public_site_payload.py site-prototype/dist

      - name: Reject tabular data and archives from the public site bundle
        run: python scripts/validate_public_site_file_boundary.py site-prototype/dist

      - name: Package only browser-facing site assets
        shell: bash
        run: |
          mkdir -p _site
          cp -R site-prototype/dist/. _site/
          rm _site/catalog.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload only the static website directory
        uses: actions/upload-pages-artifact@5f327015a708106f6f1b7c9a633901af30fe80cb # upstream main; bundles Node 24-compatible upload-artifact v7.0.1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
